output_dir: ./runs/train/${now:%Y-%m-%d}_${now:%H-%M-%S}
batch_size: 4
num_workers: 6
lr_scheduler_type: cosine
learning_rate: 0.0001
num_epochs: 1
max_steps: 10000
log_every: 10
save_every: 2000
eval_every: 0
eval_num_inference_steps: 10
gradient_accumulation_steps: 2
mixed_precision: bf16
seed: 42
max_grad_norm: 1.0
weight_decay: 0.01
resume: null
wandb:
  enabled: false
  workspace: null
  project: fast-wam
  name: train
  group: null
  mode: online
data:
  train:
    _target_: fastwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
    dataset_dirs:
    - /scratch/users/ntu/yguo017/fastwam-agilex-bf16-20261106/data/agilex_pnp_lerobot
    shape_meta:
      images:
      - key: image
        raw_shape:
        - 3
        - 240
        - 320
        shape:
        - 3
        - 224
        - 224
      - key: wrist_image
        raw_shape:
        - 3
        - 240
        - 320
        shape:
        - 3
        - 224
        - 224
      action:
      - key: joints
        raw_shape: 6
        shape: 6
      - key: gripper
        raw_shape: 1
        shape: 1
      state:
      - key: joints
        raw_shape: 6
        shape: 6
      - key: gripper
        raw_shape: 1
        shape: 1
    num_frames: 33
    global_sample_stride: 1
    action_video_freq_ratio: 4
    video_size:
    - 224
    - 448
    camera_key: null
    val_set_proportion: 0.0
    is_training_set: true
    pretrained_norm_stats: /scratch/users/ntu/yguo017/fastwam-agilex-bf16-20261106/data/dataset_stats.json
    skip_padding_as_possible: false
    concat_multi_camera: horizontal
    video_backend: pyav
    processor:
      _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
      shape_meta: ${data.train.shape_meta}
      num_obs_steps: ${data.train.num_frames}
      num_output_cameras: 2
      action_output_dim: 7
      proprio_output_dim: 8
      delta_action_dim_mask: null
      action_state_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.relative_action.RelativeJointTransform
        keys:
        - joints
      use_stepwise_action_norm: false
      norm_default_mode: min/max
      norm_exception_mode: null
      action_state_merger:
        _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
        state_target_dim: 8
      train_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size:
        - 224
        - 224
      val_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size:
        - 224
        - 224
    text_embedding_cache_dir: /scratch/users/ntu/yguo017/fastwam-agilex-bf16-20261106/data/text_embeds_cache/agilex
    use_text_embed_cache: true
    context_len: 128
model:
  _target_: fw_agilex.create_model
  model_id: Wan-AI/Wan2.2-TI2V-5B
  tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
  tokenizer_max_len: 128
  load_text_encoder: false
  proprio_dim: ${data.train.processor.proprio_output_dim}
  redirect_common_files: true
  mot_checkpoint_mixed_attn: false
  compile_training_denoise: false
  action_idm_prob: 0.5
  video_cond_noise_prob: 0.0
  action_dit_pretrained_path: null
  skip_dit_load_from_pretrain: true
  video_dit_config:
    has_image_input: false
    patch_size:
    - 1
    - 2
    - 2
    in_dim: 48
    hidden_dim: 3072
    ffn_dim: 14336
    freq_dim: 256
    text_dim: 4096
    out_dim: 48
    num_heads: 24
    attn_head_dim: 128
    num_layers: 30
    eps: 1.0e-06
    seperated_timestep: true
    require_clip_embedding: false
    require_vae_embedding: false
    fuse_vae_embedding_in_latents: true
    use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
    video_attention_mask_mode: first_frame_causal
    action_conditioned: false
    action_dim: ${data.train.processor.action_output_dim}
    action_group_causal_mask_mode: group_diagonal
  action_dit_config:
    action_dim: ${data.train.processor.action_output_dim}
    hidden_dim: 1024
    ffn_dim: 4096
    num_heads: 24
    attn_head_dim: 128
    num_layers: 30
    text_dim: 4096
    freq_dim: 256
    eps: 1.0e-06
    use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
  video_scheduler:
    train_shift: 5.0
    infer_shift: 5.0
    num_train_timesteps: 1000
  action_scheduler:
    train_shift: 1.0
    infer_shift: 1.0
    num_train_timesteps: 1000
  loss:
    lambda_video: 1.0
    lambda_action: 1.0
  init_checkpoint: /scratch/users/ntu/yguo017/fastwam-smoke/checkpoints/libero_optional_idm_2cam224.clean.pt
