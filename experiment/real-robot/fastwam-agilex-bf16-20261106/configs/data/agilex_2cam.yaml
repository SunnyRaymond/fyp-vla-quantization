# AgileX Piper, two pick-and-place tasks, 78 episodes at 10 Hz (LeRobot v2.1 converted by convert_agilex.py).
# Same layout as libero_2cam: third-person `image` left, wrist `wrist_image` right, each 224x224, 33 frames ->
# 32 actions + 9 video frames. Joints are trained relative to the current state, the gripper stays absolute; the
# 7-dim state is zero-padded to the LIBERO checkpoint's 8-dim proprio input.
train:
  _target_: fastwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  dataset_dirs:
    - /scratch/users/ntu/yguo017/fastwam-agilex-bf16-20261106/data/agilex_pnp_lerobot
  shape_meta:
    images:
      - key: image
        raw_shape: [3, 240, 320]
        shape: [3, 224, 224]
      - key: wrist_image
        raw_shape: [3, 240, 320]
        shape: [3, 224, 224]
    action:
      - key: joints
        raw_shape: 6
        shape: 6
      - key: gripper
        raw_shape: 1
        shape: 1
    state:
      - key: joints
        raw_shape: 6
        shape: 6
      - key: gripper
        raw_shape: 1
        shape: 1
  num_frames: 33
  global_sample_stride: 1
  action_video_freq_ratio: 4 # 32 actions, 9 video frames
  video_size: [224, 448]
  camera_key: null
  val_set_proportion: 0.0
  is_training_set: true
  pretrained_norm_stats: /scratch/users/ntu/yguo017/fastwam-agilex-bf16-20261106/data/dataset_stats.json
  skip_padding_as_possible: false
  concat_multi_camera: "horizontal"
  video_backend: pyav # train.pbs overrides with the backend prep verified
  processor:
    _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 2
    action_output_dim: 7 # joints (6, relative) + gripper (1, absolute)
    proprio_output_dim: 8 # joints (6) + gripper (1) + one zero pad
    # Raw actions are absolute joint targets; the relative transform runs after this mask would zero padded steps,
    # so the mask stays off and padded steps (last pose repeated) become "hold the final pose".
    delta_action_dim_mask: null
    action_state_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.relative_action.RelativeJointTransform
        keys: [joints]
    use_stepwise_action_norm: False
    norm_default_mode: min/max
    norm_exception_mode: null
    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
      state_target_dim: 8
    train_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [224, 224]
    val_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [224, 224]
  text_embedding_cache_dir: /scratch/users/ntu/yguo017/fastwam-agilex-bf16-20261106/data/text_embeds_cache/agilex
  use_text_embed_cache: true
  context_len: 128
